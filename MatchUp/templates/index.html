<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>MatchUp - Painel de Controle</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        fieldset {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 10px;
        }

        input, select, button {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input, select {
            flex: 1;
            min-width: 140px;
        }

        button {
            cursor: pointer;
            background-color: #0056b3;
            color: white;
            border: none;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
        }

        button:hover {
            background-color: #004494;
        }

        .btn-del {
            background-color: #dc3545;
            width: auto;
            margin: 0;
            padding: 5px 10px;
        }

        .btn-del:hover {
            background-color: #c82333;
        }

        .btn-acao {
            background-color: #28a745;
            width: auto;
            margin-top: 0;
        }

        .btn-acao:hover {
            background-color: #218838;
        }

        .sessao {
            background: white;
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>MatchUp - Painel de Controle Oficial</h1>

    <div class="sessao">
        <h2>Sessão</h2>
        <div id="areaSessao">Verificando sessão...</div>
    </div>

    <div class="grid">
        <fieldset>
            <legend><b>1. Login</b></legend>

            <div class="input-group">
                <input id="loginEmail" placeholder="E-mail">
                <input id="loginSenha" type="password" placeholder="Senha">
            </div>

            <button onclick="login()">Entrar</button>
            <button class="btn-del" onclick="logout()">Sair</button>
        </fieldset>

        <fieldset>
            <legend><b>2. Gestão de Usuários</b></legend>

            <div class="input-group">
                <input id="nome" placeholder="Nome Completo">
                <input id="email" placeholder="E-mail">
                <input id="senha" type="password" placeholder="Senha">
                <input id="data_nascimento" type="date" title="Data de Nascimento">
                <input id="apelido" placeholder="Apelido">
                <input id="foto_perfil" placeholder="URL da Foto de Perfil">
            </div>

            <button onclick="cadastrarUsuario()">Criar Usuário</button>
            <button class="btn-acao" onclick="listarUsuarios()">Listar Todos</button>

            <table id="tabUsuarios">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Apelido</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </fieldset>

        <fieldset>
            <legend><b>3. Gestão de Atividades</b></legend>

            <div class="input-group">
                <input id="tituloAtividade" placeholder="Título da Atividade">
                <input id="categoriaAtividade" placeholder="Categoria">
                <input id="dataAtividade" type="date" title="Data da Atividade">
                <input id="horarioAtividade" type="time" title="Horário da Atividade">
                <input id="localAtividade" placeholder="Local">
                <input id="limiteVagas" type="number" placeholder="Limite de Vagas">
                <input id="descricaoAtividade" placeholder="Descrição">
                <input id="requisitosAtividade" placeholder="Requisitos">
            </div>

            <button onclick="cadastrarAtividade()">Criar Atividade</button>
            <button class="btn-acao" onclick="listarAtividades()">Listar Todas</button>

            <table id="tabAtividades">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Local</th>
                        <th>Vagas</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </fieldset>

        <fieldset>
            <legend><b>4. Gestão de Inscrições</b></legend>

            <div class="input-group">
                <select id="i_email">
                    <option value="">Selecione o Usuário...</option>
                </select>

                <select id="i_titulo">
                    <option value="">Selecione a Atividade...</option>
                </select>
            </div>

            <button onclick="cadastrarInscricao()">Realizar Inscrição</button>
            <button class="btn-acao" onclick="listarInscricoes()">Listar Todas</button>

            <table id="tabInscricoes">
                <thead>
                    <tr>
                        <th>Participante</th>
                        <th>Atividade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </fieldset>

        <fieldset>
            <legend><b>5. Gestão de Avaliações</b></legend>

            <div class="input-group">
                <select id="av_email">
                    <option value="">Selecione o Avaliador...</option>
                </select>

                <select id="av_avaliado">
                    <option value="">Selecione o Avaliado...</option>
                </select>

                <select id="av_titulo">
                    <option value="">Selecione a Atividade...</option>
                </select>

                <input id="av_nota" type="number" placeholder="Nota (0 a 10)" min="0" max="10">
                <input id="av_comentario" placeholder="Comentário da experiência">
            </div>

            <button onclick="cadastrarAvaliacao()">Registrar Avaliação</button>
            <button class="btn-acao" onclick="listarAvaliacao()">Listar Todas</button>

            <table id="tabAvaliacoes">
                <thead>
                    <tr>
                        <th>Avaliador</th>
                        <th>Avaliado</th>
                        <th>Atividade</th>
                        <th>Nota</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </fieldset>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
